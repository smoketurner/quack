name: Advisories

# `ci.yml` runs cargo-deny only when code changes. An advisory published
# against a pinned dependency while the repository is quiet would go
# unnoticed until the next push, so this runs the same check every week
# (Dependabot's alerts cover vulnerability advisories, not RustSec's
# `unmaintained` and `unsound` classes or license and source drift) and
# opens one issue, updated in place, while it fails.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        continue-on-error: true
        with:
          command: check
      - name: Open or update the advisory issue
        if: steps.deny.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="cargo deny check fails on the weekly advisory scan"
          body="The scheduled \`cargo deny check\` failed. See the run for the advisory, license, or source finding: ${RUN_URL}"
          number="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number')"
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body "Still failing: ${RUN_URL}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
      - name: Fail the run when the check failed
        if: steps.deny.outcome == 'failure'
        run: exit 1
