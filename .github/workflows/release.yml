name: Release

# Tag-triggered only (`v*`), or by hand, so it never spends minutes on
# ordinary pushes. Produces: static musl binaries for Linux x86_64 and
# aarch64 (reproducible, with SBOMs), native macOS and Windows binaries, the
# `quack serve` image for amd64 and arm64 on GHCR plus its tarballs for
# air-gapped hosts, SHA256SUMS, a Homebrew formula, and a GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  gates:
    name: Release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      - name: Setup Rust toolchain
        run: rustup show
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v1"
          shared-key: "debug-${{ runner.os }}"
          lookup-only: true
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - name: Crypto gates (aws-lc-rs only, no ring or OpenSSL at runtime)
        run: make release-gates
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  musl:
    name: Static musl (${{ matrix.name }})
    needs: gates
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the reproducible static binary
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          targets: ci
        env:
          TARGET: ${{ matrix.target }}
          GENERATE_SBOM: "true"
      - name: Smoke test
        run: |
          "./target/${TARGET}/release/quack" --help
        env:
          TARGET: ${{ matrix.target }}
      - name: Collect
        run: |
          mkdir -p "binaries/${TARGET}"
          cp "target/${TARGET}/release/quack" "binaries/${TARGET}/quack"
          sbom="$(find crates -name '*cdx.json' | head -1)"
          if [ -n "$sbom" ]; then cp "$sbom" "binaries/${TARGET}/quack.cdx.json"; fi
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.target }}
          path: binaries/
          if-no-files-found: error

  native:
    name: Native (${{ matrix.name }})
    needs: gates
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin, binary: quack }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, binary: quack }
          - { name: windows-x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc, binary: quack.exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        shell: bash
        run: rustup show && rustup target add "${TARGET}"
        env:
          TARGET: ${{ matrix.target }}
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v1"
          shared-key: "release-${{ matrix.target }}"
          lookup-only: true
      - name: Build
        shell: bash
        run: cargo build --release --locked --package quack --target "${TARGET}"
        env:
          TARGET: ${{ matrix.target }}
      - name: Smoke test and collect
        shell: bash
        run: |
          "./target/${TARGET}/release/${BINARY}" --help
          mkdir -p "binaries/${TARGET}"
          cp "target/${TARGET}/release/${BINARY}" "binaries/${TARGET}/${BINARY}"
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.target }}
          path: binaries/
          if-no-files-found: error

  image:
    name: Container image
    needs: musl
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*-linux-musl
          path: binaries
          merge-multiple: true
      - name: Lay out the binaries per architecture
        run: |
          mkdir -p dist/linux-amd64 dist/linux-arm64
          cp binaries/x86_64-unknown-linux-musl/quack dist/linux-amd64/quack
          cp binaries/aarch64-unknown-linux-musl/quack dist/linux-arm64/quack
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
      - name: Image tarballs for air-gapped hosts
        run: |
          mkdir -p images
          for arch in amd64 arm64; do
            docker buildx build --file Dockerfile.release --platform "linux/${arch}" \
              --tag "quack:${VERSION}" \
              --output "type=docker,dest=images/quack-image-${VERSION}-linux-${arch}.tar" .
          done
        env:
          VERSION: ${{ steps.tag.outputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images
          path: images/
          if-no-files-found: error

  publish:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [musl, native, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          path: binaries
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images
          path: dist
      - name: Package
        run: scripts/release/package.sh "${GITHUB_REF_NAME#v}" binaries dist
      - name: Publish
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag ./dist/*
        env:
          GH_TOKEN: ${{ github.token }}
