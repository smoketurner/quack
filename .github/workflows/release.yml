name: Release

# Tag-triggered only (`v*`), or by hand, so it never spends minutes on
# ordinary pushes. Building and publishing are separate jobs on purpose: every
# artifact is built, signed, and attested inside reusable-build.yml, which never
# holds `contents: write`, and this workflow's publish job only uploads what
# came out of it. That split is what makes the provenance SLSA Build Level 3 —
# the Sigstore certificate names reusable-build.yml as the builder.
#
# Produces: static musl binaries for Linux x86_64 and aarch64 (reproducible,
# with SBOMs), native macOS arm64 and Windows x86_64/aarch64 binaries (signed
# when the signing secrets are set), the `quack serve` image for amd64 and arm64
# on GHCR plus its tarballs for air-gapped hosts, SHA256SUMS, a Homebrew
# formula, and a GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  gates:
    name: Release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      - name: Setup Rust toolchain
        run: rustup show
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v1"
          shared-key: "debug-${{ runner.os }}"
          lookup-only: true
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - name: Crypto gates (aws-lc-rs only, no ring or OpenSSL at runtime)
        run: make release-gates
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  version:
    name: Release version
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive the version from the ref
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" = "tag" ]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

  # Everything that touches a compiler lives in the reusable workflow so the
  # attestations it writes name that workflow as the builder. The permissions
  # here are the ceiling for its jobs; each one declares its own subset.
  build:
    name: Build
    needs: [gates, version]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: $/.github/workflows/reusable-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      push-image: ${{ github.ref_type == 'tag' }}
    secrets:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE_NAME: ${{ secrets.APPLE_CERTIFICATE_NAME }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      CERTIFICATE_PROFILE: ${{ secrets.CERTIFICATE_PROFILE }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  publish:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: this job only moves artifacts the build workflow produced.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: images-*
          path: dist
          merge-multiple: true
      - name: Collect SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          # The per-archive .sha256 files came from the machines that built
          # them; verify against those, then publish one consolidated file.
          sha256sum -c -- *.sha256
          rm ./*.sha256
          sha256sum -- *.tar.gz *.zip *.tar > SHA256SUMS
      - name: Publish
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag ./dist/*
        env:
          GH_TOKEN: ${{ github.token }}
