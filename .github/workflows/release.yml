name: Release

# Tag-triggered only (`v*`), or by hand, so it never spends minutes on
# ordinary pushes. Building and publishing are separate jobs on purpose: every
# artifact is built, signed, and attested inside reusable-build.yml, which never
# holds `contents: write`, and this workflow's publish job only uploads what
# came out of it. That split is what makes the provenance SLSA Build Level 3 —
# the Sigstore certificate names reusable-build.yml as the builder.
#
# Produces: static musl binaries for Linux x86_64 and aarch64 (reproducible,
# with SBOMs), native macOS arm64 and Windows x86_64/aarch64 binaries (signed
# when the signing secrets are set), the `quack serve` image for amd64 and arm64
# on GHCR plus its tarballs for air-gapped hosts, signed .deb and .rpm packages
# (also pushed to smoketurner/packages, served as packages.smoketurner.com),
# SHA256SUMS, a Homebrew formula, and a GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release at a time, queued rather than cancelled. The group name is a
# constant, not derived from the ref, so a second tag serialises behind the
# first instead of running beside it: two releases in flight would race on the
# push-by-digest uploads to GHCR and on the `imagetools create --tag latest` in
# image-index. `cancel-in-progress` stays false because interrupting a release
# is worse than delaying one — a cancelled run can leave digests pushed with no
# index pointing at them. Note GitHub holds only one run pending per group, so a
# third release queued behind a running one and a waiting one displaces the
# waiting one; releases are hand-cut, so that is not a path we take.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # AWS-LC's delocate pass cannot parse gcc's assembly output, so the FIPS
  # module (Linux only) builds with clang. Ignored on macOS and Windows, which
  # build against aws-lc-sys instead.
  AWS_LC_FIPS_SYS_CC: clang
  AWS_LC_FIPS_SYS_CXX: clang++
  CARGO_BUILD_WARNINGS: deny
  # Must match ci.yml exactly: rust-cache hashes every CARGO_* variable into its
  # key, so a difference here would stop the gates job below from restoring the
  # cache CI saved on main. See the note in ci.yml.
  CARGO_PROFILE_DEV_DEBUG: "1"

jobs:
  gates:
    name: Release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang golang-go
      - name: Setup Rust toolchain
        run: rustup show
      # Restore-only. A release run must never write a cache entry, but it does
      # read the one CI saved on main, and that is where this job's time went:
      # `lookup-only` only probes for the key and downloads nothing, so gates
      # recompiled DuckDB's C++ amalgamation twice (once for clippy, once for
      # the tests) on every release. `save-if: false` is the restore-only knob.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          prefix-key: "v1"
          # Matches ci.yml's `test` job, so this restores what CI already built —
          # above all libduckdb-sys's build-script output, the ~9 minutes both
          # the clippy and the test step here would otherwise each pay.
          shared-key: "debug-${{ runner.os }}"
          save-if: "false"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - name: Crypto gates (aws-lc-rs only, no ring or OpenSSL at runtime)
        # Not `make release-gates`: that target also runs `cargo deny check`,
        # which needs a cargo-deny install this runner does not have. The
        # pinned cargo-deny action below is how this workflow checks deny.
        run: make crypto-gates
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  version:
    name: Release version
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive the version from the ref
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" = "tag" ]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

  # Everything that touches a compiler lives in the reusable workflow so the
  # attestations it writes name that workflow as the builder. The permissions
  # here are the ceiling for its jobs; each one declares its own subset.
  build:
    name: Build
    needs: [gates, version]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: $/.github/workflows/reusable-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      push-image: ${{ github.ref_type == 'tag' }}
    secrets:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE_NAME: ${{ secrets.APPLE_CERTIFICATE_NAME }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      CERTIFICATE_PROFILE: ${{ secrets.CERTIFICATE_PROFILE }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: this job only moves artifacts the build workflow produced.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: images-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Collect SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          # The per-archive .sha256 files came from the machines that built
          # them; verify against those, then publish one consolidated file.
          sha256sum -c -- *.sha256
          rm ./*.sha256
          sha256sum -- *.tar.gz *.zip *.tar *.deb *.rpm > SHA256SUMS
      - name: Publish
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag ./dist/*
        env:
          GH_TOKEN: ${{ github.token }}
          # Without a checkout there is no git remote to infer the repository
          # from, and gh exits 1 on "not a git repository" before it makes a
          # single API call. GH_REPO is what names the repository instead.
          GH_REPO: ${{ github.repository }}

  # Adds the packages the build signed to the APT and YUM repositories in
  # smoketurner/packages, re-signs their metadata, and pushes. The push uses
  # PACKAGES_REPO_TOKEN, a fine-grained token with contents: write on that one
  # repository; a GITHUB_TOKEN push could not reach it, and a PAT push is what
  # triggers its publish-to-s3.yml. Runs after publish so a failed GitHub
  # release never leaves packages in the repository without a release.
  publish-packages:
    name: Publish to packages.smoketurner.com
    if: github.ref_type == 'tag'
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] — the credentials push the commit below
          repository: smoketurner/packages
          token: ${{ secrets.PACKAGES_REPO_TOKEN }}
          path: packages-repo

      - name: Install repository tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils dpkg-dev createrepo-c

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "${GPG_PRIVATE_KEY}" | gpg --batch --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          echo "GPG_FPR=${fpr}" >> "$GITHUB_ENV"

      - name: Add the packages and re-sign the metadata
        working-directory: packages-repo
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          sign() {
            gpg --batch --yes --pinentry-mode loopback --passphrase "${GPG_PASSPHRASE}" \
              --local-user "${GPG_FPR}" "$@"
          }

          cp ../packages/*.deb apt/pool/main/
          for rpm in ../packages/*.rpm; do
            case "${rpm}" in
              *.x86_64.rpm) cp "${rpm}" rpm/x86_64/ ;;
              *.aarch64.rpm) cp "${rpm}" rpm/aarch64/ ;;
              *) echo "::error::unexpected RPM architecture: ${rpm}"; exit 1 ;;
            esac
          done

          # dpkg-scanpackages runs from apt/ so each Filename is relative to
          # https://packages.smoketurner.com/apt, the APT source root.
          # --multiversion indexes every version in the pool, not just the
          # newest, so `apt-get install quack=<version>` works like it does
          # with dnf.
          for arch in amd64 arm64; do
            index="dists/stable/main/binary-${arch}/Packages"
            (cd apt && dpkg-scanpackages --multiversion --arch "${arch}" pool/main > "${index}")
            gzip -9nc "apt/${index}" > "apt/${index}.gz"
          done
          # The previous Release would otherwise be hashed into the new one.
          rm -f apt/dists/stable/Release apt/dists/stable/InRelease apt/dists/stable/Release.gpg
          apt-ftparchive -c apt-ftparchive.conf release apt/dists/stable > Release.new
          mv Release.new apt/dists/stable/Release
          sign --clearsign -o apt/dists/stable/InRelease apt/dists/stable/Release
          sign --detach-sign --armor -o apt/dists/stable/Release.gpg apt/dists/stable/Release

          for arch in x86_64 aarch64; do
            createrepo_c --update "rpm/${arch}"
            sign --detach-sign --armor -o "rpm/${arch}/repodata/repomd.xml.asc" \
              "rpm/${arch}/repodata/repomd.xml"
          done

      - name: Commit and push
        working-directory: packages-repo
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "quack ${VERSION}"
          git push
