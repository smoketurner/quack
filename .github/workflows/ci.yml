name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # AWS-LC's delocate pass cannot parse gcc's assembly output, so the FIPS
  # module (Linux only) builds with clang. Ignored on macOS and Windows, which
  # build against aws-lc-sys instead.
  AWS_LC_FIPS_SYS_CC: clang
  AWS_LC_FIPS_SYS_CXX: clang++
  # Deny rustc warnings on plain `cargo build`/`cargo test` (cargo >=1.97) without
  # invalidating the build cache the way RUSTFLAGS="-D warnings" would.
  CARGO_BUILD_WARNINGS: deny
  # Line-tables-only debuginfo (`debug = 1`): test backtraces keep file and line
  # numbers, but the cached `target/` is roughly half the size. The repository
  # gets 10 GB of Actions cache in total, and full-debuginfo entries overran it,
  # so GitHub evicted them between runs and every job recompiled DuckDB's C++
  # amalgamation from scratch (~9 minutes). rust-cache hashes every CARGO_*
  # variable into its cache key, so release.yml's gates job has to set this
  # identically or it cannot restore what CI saved.
  CARGO_PROFILE_DEV_DEBUG: "1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        run: rustup show
      # No rust-cache step: `cargo fmt` shells out to `cargo metadata --no-deps`,
      # so it never resolves the dependency graph, downloads from the registry,
      # or writes to `target/`. The entry it used to save held nothing this job
      # reads and only competed for the repository's cache budget.
      - run: cargo fmt --all --check

  check:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Lint & Test (linux)
            runner: ubuntu-latest
            lint: true
            install-deps: sudo apt-get update && sudo apt-get install -y cmake clang golang-go
          - label: Test (macos)
            runner: macos-latest
            lint: false
            install-deps: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        if: matrix.install-deps != ''
        run: ${{ matrix.install-deps }} # zizmor: ignore[template-injection] — static matrix value
      - name: Setup Rust toolchain
        run: rustup show
      # One cache entry per runner OS, holding the clippy and the test artifacts
      # together. Clippy used to be a separate job with its own entry; two
      # multi-GB entries per OS did not fit the 10 GB budget alongside macOS, so
      # they evicted each other and both jobs rebuilt DuckDB every run. The
      # workspace declares no Cargo features, so `--all-features` resolves to the
      # same dependency graph `cargo test` uses and the two share fingerprints.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v1"
          shared-key: "check-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Clippy
        if: matrix.lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --workspace

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          vulnerability-check: true
          license-check: true

  license-check:
    name: License, Advisory & Ban Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `check` runs advisories + bans + licenses + sources, so the
      # OpenSSL/ring bans in deny.toml are enforced too (see docs/crypto.md).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
