name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue builds each entry on its own `gh-readonly-queue/main/...`
  # ref and dispatches `merge_group` — not `push`, not `pull_request`. Without
  # this trigger nothing runs against that ref, so any check the branch ruleset
  # requires would never report and the entry would sit until the queue's
  # check_response_timeout_minutes expired. The jobs below are the ones the
  # ruleset requires; `dependency-review` skips itself here, because
  # dependency-review-action only works in a pull request context.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main, and never cancel a queue entry. `github.ref` is unique
  # per merge group, so nothing would supersede one in practice, but a cancelled
  # required check drops the entry from the queue and that is not a failure mode
  # worth leaving to chance. Cancelling on main would be worse than wasteful: it
  # skips the Post Setup Rust cache step, and main is the only ref that saves a
  # cache for every other run to restore.
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # AWS-LC's delocate pass cannot parse gcc's assembly output, so the FIPS
  # module (Linux only) builds with clang. Ignored on macOS and Windows, which
  # build against aws-lc-sys instead.
  AWS_LC_FIPS_SYS_CC: clang
  AWS_LC_FIPS_SYS_CXX: clang++
  # Deny rustc warnings on plain `cargo build`/`cargo test` (cargo >=1.97) without
  # invalidating the build cache the way RUSTFLAGS="-D warnings" would.
  CARGO_BUILD_WARNINGS: deny
  # Line-tables-only debuginfo (`debug = 1`): test backtraces keep file and line
  # numbers, but the cached `target/` is roughly half the size. This is what
  # keeps the caches below inside the repository's 10 GB Actions budget. At full
  # debuginfo the three entries came to 10.4 GB on their own, so GitHub evicted
  # them between runs — and only an exact key hit preserves libduckdb-sys's
  # build-script output, so every eviction cost another ~9 minutes recompiling
  # DuckDB's C++ amalgamation. rust-cache hashes every CARGO_* variable into its
  # cache key, so release.yml's gates job has to set this identically or it
  # cannot restore what CI saved.
  CARGO_PROFILE_DEV_DEBUG: "1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        run: rustup show
      # No rust-cache step: `cargo fmt` shells out to `cargo metadata --no-deps`,
      # so it never resolves the dependency graph, downloads from the registry,
      # or writes to `target/`. The entry it used to save held nothing this job
      # reads and only competed for the repository's cache budget.
      - run: cargo fmt --all --check

  # clippy and test stay separate, parallel jobs with a cache entry each. Folding
  # them into one job would halve the number of entries, but they only run in
  # sequence there: measured cold on run 35522371594, clippy 11m36s then tests
  # 13m08s, 25m08s for the job, against ~13m when the two run side by side.
  # Keeping both entries is affordable now that the debuginfo setting above has
  # roughly halved each one.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang golang-go
      - name: Setup Rust toolchain
        run: rustup show
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v1"
          shared-key: "clippy-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: Unit Tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            install-deps: sudo apt-get update && sudo apt-get install -y cmake clang golang-go
          - name: macos
            runner: macos-latest
            install-deps: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        if: matrix.install-deps != ''
        run: ${{ matrix.install-deps }} # zizmor: ignore[template-injection] — static matrix value
      - name: Setup Rust toolchain
        run: rustup show
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v1"
          shared-key: "debug-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Run tests
        run: cargo test --locked --workspace

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          vulnerability-check: true
          license-check: true

  license-check:
    name: License, Advisory & Ban Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `check` runs advisories + bans + licenses + sources, so the
      # OpenSSL/ring bans in deny.toml are enforced too (see docs/crypto.md).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
