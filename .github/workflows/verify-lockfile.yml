name: Verify actions lockfile

# Fails when .github/workflows/actions.lock is out of step with the workflows
# or a locked commit no longer verifies upstream. Triggered whenever a workflow
# file or the lockfile changes.

on:
  push:
    # Scoped to main, matching ci.yml. Without it every push to a branch with an
    # open pull request ran this twice, once per event, on the same commit.
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"

# Supersede the previous run on the same ref: only the newest workflow files
# matter, and nothing here writes a cache that a cancellation would strand.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    name: Verify lockfile
    runs-on: ubuntu-slim
    permissions:
      contents: read # checkout the workflows and the lockfile
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify every action against the lockfile
        run: gh actions-lock --verify
