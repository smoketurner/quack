# cargo-deny configuration. Run with `cargo deny check`.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

[advisories]
# Fail on any security advisory. Add specific RUSTSEC IDs here only with a
# justification comment when an advisory truly does not apply.
ignore = [
    # ttf-parser is unmaintained but only used transitively by pdf-extract for
    # font parsing during PDF text extraction. No security impact.
    "RUSTSEC-2026-0192",
    # basic-toml is unmaintained with no successor release; askama_derive uses it
    # only to read askama's own config file while templates compile, never input.
    "RUSTSEC-2026-0374",
    # SQLite before 3.54.0 can return uninitialized page-cache memory when a
    # database is opened with a crafted sibling -wal file of another page size.
    # libsqlite3-sys 0.30.1 bundles an affected SQLite, and sqlx 0.9.0 (the
    # newest release) requires 0.30, so the fixed 0.39 cannot be taken yet.
    # control.db is quack's own file in the 0700 data directory, but
    # `quack import sqlite:PATH` opens a file the user names (read-only, which
    # still reads its -wal), so a crafted pair could put stale process memory
    # into the imported table. Remove this once sqlx moves to 0.39.
    "RUSTSEC-2026-0459",
]

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = [
    # The FIPS-validated AWS-LC module, used on Linux only (quack-core's
    # target-gated aws-lc-rs "fips" feature). Its sources carry the OpenSSL
    # license because AWS-LC descends from OpenSSL via BoringSSL. That is the
    # license, not the banned `openssl` crate: nothing links OpenSSL itself,
    # which `make release-gates` re-checks with `cargo tree -i openssl-sys`.
    { allow = ["OpenSSL"], crate = "aws-lc-fips-sys" },
]

[bans]
multiple-versions   = "warn"
wildcards           = "deny"
allow-wildcard-paths = true
# Keep the alternative TLS/crypto stacks out of the tree. aws-lc-rs is the
# single crypto provider for this template (see docs/crypto.md).
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "ring" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
