# Detached fuzzing crate (docs/ci-cd.md): its own workspace, so the main
# workspace's lints, profiles, and lock file stay as they are. Run with
# `cd fuzz && cargo +nightly fuzz run <target>` after `cargo install cargo-fuzz`.
[package]
name = "quack-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
quack-core = { path = "../crates/quack-core" }

[[bin]]
name = "pdf"
path = "fuzz_targets/pdf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false
