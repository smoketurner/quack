[package]
name                   = "quack-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish                = false

[lints]
workspace = true

[dependencies]
argon2        = { workspace = true, features = ["alloc", "password-hash", "getrandom"] }
aws-config    = { workspace = true, features = ["rt-tokio", "default-https-client", "behavior-version-latest", "sso"] }
aws-credential-types = { workspace = true }
aws-lc-rs     = { workspace = true, features = ["aws-lc-sys"] }
aws-sdk-bedrockruntime = { workspace = true, features = ["rt-tokio", "default-https-client"] }
aws-sigv4     = { workspace = true, features = ["sign-http", "http1"] }
aws-smithy-http-client = { workspace = true, features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = { workspace = true, features = ["client", "http-1x"] }
aws-smithy-types = { workspace = true, features = ["http-body-1-x"] }
base64        = { workspace = true, features = ["std"] }
bytes         = { workspace = true, features = ["std"] }
calamine      = { workspace = true }
csv           = { workspace = true }
dirs          = { workspace = true }
duckdb        = { workspace = true, features = ["bundled", "json"] }
ego-tree      = { workspace = true }
futures       = { workspace = true, features = ["std"] }
http          = { workspace = true, features = ["std"] }
http-body     = { workspace = true }
jiff          = { workspace = true, features = ["std", "serde"] }
jsonwebtoken  = { workspace = true, features = ["aws_lc_rs"] }
keyring-core  = { workspace = true }
oauth2        = { workspace = true }
pdf_oxide     = { workspace = true, features = ["legacy-crypto"] }
quick-xml     = { workspace = true }
reqwest       = { workspace = true, features = ["rustls", "http2"] }
rig           = { workspace = true, features = ["agent", "bedrock", "derive", "rustls"] }
rust-stemmers = { workspace = true }
rustls        = { workspace = true, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
schemars      = { workspace = true, features = ["derive"] }
scraper       = { workspace = true }
sea-query     = { workspace = true, features = ["backend-sqlite", "derive"] }
secrecy       = { workspace = true }
serde         = { workspace = true, features = ["derive", "std"] }
serde_json    = { workspace = true, features = ["std"] }
sqlx          = { workspace = true, features = ["runtime-tokio", "sqlite", "postgres", "any", "migrate", "macros", "tls-rustls-aws-lc-rs"] }
tar           = { workspace = true }
thiserror     = { workspace = true, features = ["std"] }
tiktoken      = { workspace = true, features = ["vocabs-all"] }
tokio         = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-util    = { workspace = true }
toml          = { workspace = true, features = ["std", "parse", "serde", "display"] }
tracing       = { workspace = true, features = ["std"] }
uuid          = { workspace = true, features = ["std", "v7"] }
zip           = { workspace = true, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, features = ["keychain"] }

# Features union with the ones above, so Linux only adds FIPS: it is the one
# family where aws-lc-fips-sys links statically (docs/crypto.md).
[target.'cfg(target_os = "linux")'.dependencies]
aws-lc-rs                    = { workspace = true, features = ["fips"] }
aws-smithy-http-client       = { workspace = true, features = ["rustls-aws-lc-fips"] }
linux-keyutils-keyring-store = { workspace = true }
rustls                       = { workspace = true, features = ["fips"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }
sqlx      = { workspace = true, features = ["runtime-tokio", "sqlite"] }
tempfile  = { workspace = true }
zip       = { workspace = true, features = ["deflate-flate2-zlib-rs"] }

[[bench]]
name    = "retrieval"
harness = false

[[bench]]
name    = "prompt"
harness = false
