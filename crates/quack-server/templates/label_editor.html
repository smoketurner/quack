<form id="label-form" method="post" action="/w/{{ ws_id }}/tables/label/run">
  <input type="hidden" name="table" value="{{ table }}">
  <input type="hidden" name="sentence" value="{{ sentence }}">
  <input type="hidden" name="key" value="{{ key }}">
  <input type="hidden" name="text" value="{{ text }}">
  <p class="text-xs text-slate-400">{{ note }}</p>
  <div class="mt-1 overflow-x-auto">
    <table class="min-w-full text-sm" aria-label="Questions">
      <thead><tr class="border-b border-slate-700 text-left"><th scope="col" class="px-2 py-1">Name</th><th scope="col" class="px-2 py-1">Type</th><th scope="col" class="px-2 py-1">Question</th><th scope="col" class="px-2 py-1">Options or levels, one per line</th></tr></thead>
      <tbody>{% for q in rows %}
        <tr class="border-b border-slate-800 align-top">
          <td class="px-2 py-1"><input name="n{{ loop.index0 }}_name" value="{{ q.name }}" aria-label="Name of question {{ loop.index }}" class="w-32 rounded border border-slate-700 px-2 py-1 font-mono"></td>
          <td class="px-2 py-1"><select name="n{{ loop.index0 }}_kind" aria-label="Type of question {{ loop.index }}" class="rounded border border-slate-700 px-2 py-1"><option value="choice"{% if q.kind == "choice" %} selected{% endif %}>choice</option><option value="noul"{% if q.kind == "noul" %} selected{% endif %}>yes/no</option><option value="score"{% if q.kind == "score" %} selected{% endif %}>score</option></select></td>
          <td class="px-2 py-1"><input name="n{{ loop.index0 }}_ask" value="{{ q.ask }}" aria-label="Question {{ loop.index }}" class="w-full min-w-48 rounded border border-slate-700 px-2 py-1"></td>
          <td class="px-2 py-1"><textarea name="n{{ loop.index0 }}_opts" rows="3" aria-label="Options or levels of question {{ loop.index }}" class="w-full min-w-48 rounded border border-slate-700 px-2 py-1">{{ q.lines }}</textarea></td>
        </tr>{% endfor %}
      </tbody>
    </table>
  </div>
  <p class="mt-1 text-xs text-slate-400">{{ reads }}</p>
  <p class="mt-1 text-xs text-slate-400">Choice: one option per line, "label: when it applies" or just "label". Score: one level per line, lowest first. Yes/no: leave empty.</p>
  {% if can_relabel %}<label class="mt-2 inline-flex items-center gap-1 text-xs text-slate-300"><input type="checkbox" name="all" value="true"> Label every row again (otherwise only rows not labelled yet)</label>{% endif %}
  <div class="mt-2">
    <button type="button" hx-post="/w/{{ ws_id }}/tables/label/preview" hx-include="#label-form" hx-target="#label-preview" hx-swap="innerHTML" hx-disabled-elt="this" class="rounded border border-slate-700 px-3 py-1 hover:bg-slate-800">Preview 10 rows</button>
    <button type="submit" class="rounded bg-blue-600 px-3 py-1 text-white hover:bg-blue-500">Label rows</button>
  </div>
  <div id="label-preview" class="mt-3" aria-live="polite"></div>
</form>
