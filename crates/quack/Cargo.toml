[package]
name                   = "quack"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish                = false

[[bin]]
name = "quack"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
quack-core         = { path = "../quack-core" }
anyhow             = { workspace = true, features = ["std"] }
clap               = { workspace = true, features = ["derive", "help", "std", "usage"] }
crossterm          = { workspace = true }
dirs               = { workspace = true }
jiff               = { workspace = true, features = ["std"] }
mimalloc           = { workspace = true, features = ["secure"] }
ratatui            = { workspace = true, features = ["crossterm"] }
ratatui-textarea   = { workspace = true, features = ["crossterm"] }
serde_json         = { workspace = true, features = ["std"] }
tempfile           = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
tracing            = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "std"] }
