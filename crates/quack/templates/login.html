<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in · quack</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/css/output.css"></head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto max-w-sm px-4 py-16">
    <h1 class="text-2xl font-semibold">quack</h1>
    {% if let Some(error) = error %}
    <p role="alert" class="mt-4 rounded border border-red-900 bg-red-950 px-3 py-2 text-sm text-red-300 wrap-anywhere">{{ error }}</p>
    {% endif %}
    {% if let Some(host) = sign_in %}
    <a href="/auth/oidc" class="mt-6 block w-full rounded bg-blue-600 px-3 py-2 text-center text-white hover:bg-blue-500">Sign in with {{ host }}</a>
    <p class="mt-6 text-center text-sm text-slate-400">or log in with a password</p>
    {% endif %}
    <form method="post" action="/login" class="mt-6 space-y-4">
      <label class="block text-sm"><span class="text-slate-300">Username</span>
        <input name="username" required autofocus class="mt-1 w-full rounded border border-slate-700 px-3 py-2"></label>
      <label class="block text-sm"><span class="text-slate-300">Password</span>
        <input name="password" type="password" required class="mt-1 w-full rounded border border-slate-700 px-3 py-2"></label>
      <button type="submit" class="w-full rounded bg-blue-600 px-3 py-2 text-white hover:bg-blue-500">Log in</button>
    </form>
  </main>
</body>
</html>
