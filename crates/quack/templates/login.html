<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in · quack</title><link rel="stylesheet" href="/static/css/output.css"></head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-sm px-4 py-16">
    <h1 class="text-2xl font-semibold">quack</h1>
    {% if let Some(error) = error %}
    <p class="mt-4 rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800">{{ error }}</p>
    {% endif %}
    {% if let Some(host) = sign_in %}
    <a href="/login/oidc" class="mt-6 block w-full rounded bg-slate-900 px-3 py-2 text-center text-white hover:bg-slate-700">Sign in with {{ host }}</a>
    <p class="mt-6 text-center text-sm text-slate-500">or log in with a password</p>
    {% endif %}
    <form method="post" action="/login" class="mt-6 space-y-4">
      <label class="block text-sm"><span class="text-slate-700">Username</span>
        <input name="username" required autofocus class="mt-1 w-full rounded border border-slate-300 px-3 py-2"></label>
      <label class="block text-sm"><span class="text-slate-700">Password</span>
        <input name="password" type="password" required class="mt-1 w-full rounded border border-slate-300 px-3 py-2"></label>
      <button type="submit" class="w-full rounded bg-slate-900 px-3 py-2 text-white hover:bg-slate-700">Log in</button>
    </form>
  </main>
</body>
</html>
