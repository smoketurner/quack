{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-semibold">Users</h1>
{% if let Some(error) = error %}<p class="mt-3 rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800">{{ error }}</p>{% endif %}
<table class="mt-4 w-full text-sm"><thead><tr class="border-b border-slate-300 text-left text-xs uppercase text-slate-500"><th class="py-2">Username</th><th>Admin</th><th>Created</th></tr></thead><tbody>
  {% for u in users %}<tr class="border-b border-slate-200"><td class="py-2">{{ u.username }}</td><td>{% if u.is_admin %}yes{% endif %}</td><td class="text-slate-500">{{ u.created_at }}</td></tr>{% endfor %}
</tbody></table>
<form method="post" action="/admin/users" class="mt-6 flex flex-wrap items-end gap-2 text-sm">
  <input name="username" required placeholder="username" class="rounded border border-slate-300 px-3 py-2">
  <input name="password" type="password" required placeholder="password" class="rounded border border-slate-300 px-3 py-2">
  <label class="inline-flex items-center gap-1"><input type="checkbox" name="is_admin" value="true"> admin</label>
  <button type="submit" class="rounded bg-slate-900 px-3 py-2 text-white hover:bg-slate-700">Add user</button>
</form>
{% endblock %}
