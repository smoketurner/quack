{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-semibold">Users</h1>
{% if let Some(error) = error %}<p role="alert" class="mt-3 rounded border border-red-900 bg-red-950 px-3 py-2 text-sm text-red-300 wrap-anywhere">{{ error }}</p>{% endif %}
<table class="data-table mt-4 w-full text-sm"><thead><tr class="border-b border-slate-700 text-left text-xs uppercase text-slate-400"><th scope="col">Username</th><th scope="col">Admin</th><th scope="col">Created</th></tr></thead><tbody>
  {% for u in users %}<tr class="border-b border-slate-800"><td class="wrap-anywhere">{{ u.username }}</td><td>{% if u.is_admin %}yes{% endif %}</td><td class="whitespace-nowrap text-slate-400">{{ When::Clock.html(u.created_at.as_str())|safe }}</td></tr>{% endfor %}
</tbody></table>
<form method="post" action="/admin/users" class="mt-6 flex flex-wrap items-end gap-2 text-sm">
  <input aria-label="Username" name="username" required placeholder="username" class="rounded border border-slate-700 px-3 py-2">
  <input aria-label="Password" name="password" type="password" required placeholder="password" class="rounded border border-slate-700 px-3 py-2">
  <label class="inline-flex items-center gap-1"><input type="checkbox" name="is_admin" value="true"> admin</label>
  <button type="submit" class="rounded bg-blue-600 px-3 py-2 text-white hover:bg-blue-500">Add user</button>
</form>
{% endblock %}
