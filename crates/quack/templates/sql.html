{% extends "base.html" %}
{% block content %}
{% if let Some(ws) = page.workspace %}
<h1 class="text-xl font-semibold">SQL</h1>
<form hx-post="/w/{{ ws.id }}/sql" hx-target="#result" hx-swap="innerHTML" class="mt-4">
  {% include "sql_editor.html" %}
  <div class="mt-2 flex items-center gap-3 text-sm">
    <button type="submit" class="rounded bg-blue-600 px-3 py-2 text-white hover:bg-blue-500">Run</button>
    {% if !ws.can_write %}<span class="text-slate-400">Read-only: your role cannot change tables.</span>{% endif %}
  </div>
</form>
<div id="result" class="mt-6" aria-live="polite">{{ result|safe }}</div>
{% endif %}
{% endblock %}
