{% if !query.is_empty() %}
{% if hits.is_empty() %}
<p class="px-2 py-1 text-xs text-slate-400">No question or answer mentions that.</p>
{% else %}
<ul class="space-y-1 text-sm" aria-label="Matching messages">
  {% for h in hits %}
  <li><a class="block rounded px-2 py-1 hover:bg-slate-800" href="/w/{{ ws_id }}/chat?session={{ h.session_id }}#m-{{ h.seq }}"><span class="block truncate text-xs text-slate-400">{{ h.session_title.as_deref().unwrap_or("(untitled)") }} · {{ h.role.as_str() }}</span><span class="block text-slate-200 wrap-anywhere">{{ h.snippet }}</span></a></li>
  {% endfor %}
</ul>
{% endif %}
{% endif %}
