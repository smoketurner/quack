[package]
name                   = "quack-mcp"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish                = false

[lints]
workspace = true

[dependencies]
quack-core = { path = "../quack-core" }
anyhow     = { workspace = true, features = ["std"] }
http       = { workspace = true, features = ["std"] }
rmcp       = { workspace = true, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars   = { workspace = true, features = ["derive"] }
serde      = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
tokio      = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { workspace = true }
tracing    = { workspace = true, features = ["std"] }

[dev-dependencies]
quack-testkit = { path = "../quack-testkit" }
rmcp          = { workspace = true, features = ["client"] }
tempfile      = { workspace = true }
